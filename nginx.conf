map $uri $pipa_cache_control {
    default "no-cache, no-store, must-revalidate";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~*\\.(png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot)$ "public, max-age=604800";
    ~*\\.(txt|xml)$ "public, max-age=3600";
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml application/xml;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cache-Control $pipa_cache_control always;
    location /assets/ { access_log off; try_files $uri =404; }
    location = /robots.txt { default_type text/plain; try_files $uri =404; }
    location = /llms.txt { default_type text/plain; try_files $uri =404; }
    location = /sitemap.xml { default_type application/xml; try_files $uri =404; }
    location / { try_files $uri $uri/index.html =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
