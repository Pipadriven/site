# ============================================================================
# Cache-Control por tipo de recurso.
#
# Este `map` fica no topo porque precisa estar no contexto `http` — e este
# arquivo é incluído lá dentro (include /etc/nginx/conf.d/*.conf).
#
# POR QUE MAP E NÃO `expires` DENTRO DE CADA LOCATION:
# o try_files serve $uri/index.html INTERNAMENTE, sem reexecutar a escolha de
# location. Ou seja, um `location ~* \.html$` nunca chega a ser aplicado às
# páginas pré-renderizadas (/solucoes/*), que sairiam sem Cache-Control nenhum
# e ficariam sujeitas a cache heurístico de navegador e de CDN — usuário preso
# numa versão antiga depois de cada deploy. Com o map, a regra é resolvida a
# partir do $uri da requisição e vale para todo mundo.
#
# Os regexes são testados na ordem em que aparecem; o primeiro que casar vence.
# ============================================================================
map $uri $pipa_cache_control {
    # HTML (inclusive as rotas pré-renderizadas, que não têm extensão no $uri):
    # nunca em cache. É o default de propósito — na dúvida, não cacheia.
    default                                              "no-cache, no-store, must-revalidate";

    # Bundles do Vite: nome com hash, muda o nome quando muda o conteúdo.
    ~^/assets/                                           "public, max-age=31536000, immutable";

    # Imagens e fontes de /public: nome estável, cache moderado.
    ~*\.(png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot)$      "public, max-age=2592000";

    # robots.txt, llms.txt, sitemap.xml: cache curto, para que uma atualização
    # de sitemap chegue rápido aos crawlers sem bater no servidor a cada hit.
    ~*\.(txt|xml)$                                       "public, max-age=3600";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript
               application/json image/svg+xml application/xml;

    # ------------------------------------------------------------------------
    # TODOS os add_header ficam AQUI, no nível do server, e em lugar nenhum
    # mais. Regra do nginx: se um location declara qualquer add_header, ele
    # PERDE todos os add_header herdados do nível acima. A config anterior caía
    # nessa armadilha — /assets/, imagens e o index.html eram servidos sem
    # nenhum dos quatro headers de segurança abaixo.
    #
    # O Cache-Control vem do map lá em cima, então uma linha só cobre os cinco
    # casos sem precisar redeclarar nada.
    #
    # O SSL fica por conta do Traefik/EasyPanel.
    # ------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cache-Control $pipa_cache_control always;

    # Nada de `expires` neste arquivo: `expires` também escreve Cache-Control e
    # sairiam dois headers Cache-Control conflitantes na mesma resposta.

    location /assets/ {
        access_log off;
    }

    location ~* \.(png|jpe?g|gif|svg|webp|woff2?|ttf|eot)$ {
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    # Estes três são exact match e NÃO têm try_files de propósito: se o arquivo
    # sumir do build, o certo é dar 404 e aparecer no monitoramento, e não
    # devolver a casca da SPA com status 200 — que é exatamente o que
    # /llms.txt faz hoje em produção (200 com o HTML do site dentro).
    location = /robots.txt  { access_log off; log_not_found off; }
    location = /llms.txt    { default_type text/plain;       access_log off; log_not_found off; }
    location = /sitemap.xml { default_type application/xml;  access_log off; log_not_found off; }

    # ========================================================================
    # A ORDEM AQUI É O QUE FAZ O PRERENDER VALER ALGUMA COISA.
    #
    # $uri/index.html precisa vir ANTES do fallback /index.html. Assim
    # /solucoes/assistente-comercial serve o HTML pré-renderizado daquela rota
    # em vez da casca vazia da SPA. Com o try_files antigo
    # (`$uri $uri/ /index.html`) o resultado dependia da diretiva `index` e o
    # fallback podia vencer — servindo a home para todas as rotas.
    #
    # O último /index.html continua existindo como rede de segurança: rota que
    # não foi pré-renderizada (ex.: uma solução nova ainda não publicada)
    # segue funcionando como SPA em vez de dar 404.
    # ========================================================================
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    error_page 500 502 503 504 /index.html;
}
